<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generatore FULL TIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--blue:#333366;--bg:#f3f4f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:#17172c}
main{max-width:760px;margin:0 auto;padding:18px 14px 34px}h1{font-size:24px;margin:4px 0 5px}.sub{color:#66677c;font-size:14px;margin:0 0 18px}
.panel,.preview{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 18px #20204412;margin-bottom:14px}
label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}input,textarea{width:100%;border:1px solid #d8d9e5;border-radius:11px;padding:12px;font:inherit;font-size:16px;background:white;color:#17172c}
textarea{min-height:96px;resize:vertical}.field{margin-top:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;width:100%;background:var(--blue);color:white;margin-top:10px}button.secondary{background:#e9e9f2;color:var(--blue)}
.file{padding:10px;background:#f8f8fc}canvas{display:block;width:100%;height:auto;border-radius:8px}.note{font-size:12px;color:#707186;line-height:1.45;margin:10px 4px 0}
@media(max-width:430px){main{padding:14px 10px 28px}.panel,.preview{padding:13px}.row{gap:8px}}
</style></head><body><main>
<h1>A.S.D. GS RAIANO 1968</h1>
<section class="panel">
<div>
 <label for="photo">Carica la foto della partita</label>
 <input class="file" id="photo" type="file" accept="image/*">
 <button type="button" id="loadPhoto">Carica foto</button>
 <p class="note" id="photoStatus" aria-live="polite">Seleziona una foto e poi premi “Carica foto”.</p>
</div>
<div class="row field"><div><label for="home">Gol squadra sinistra</label><input id="home" inputmode="numeric" value=""></div><div><label for="away">Gol squadra destra</label><input id="away" inputmode="numeric" value=""></div></div>
<div class="row field"><div><label for="scorersHome">Marcatori squadra sinistra</label><textarea id="scorersHome" placeholder="Uno per riga&#10;Rossi 23'&#10;Verdi 71'"></textarea></div><div><label for="scorersAway">Marcatori squadra destra</label><textarea style="text-align: left;" id="scorersAway" placeholder="Uno per riga&#10;Bianchi 12'&#10;Neri 84'"></textarea></div></div>
<button id="update">Aggiorna anteprima</button><button class="secondary" id="save">Salva immagine PNG</button>
</section><section class="preview"><canvas id="canvas"></canvas></section>
</main>
<script>

let backgroundImage = null;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
let currentObjectUrl = null;

function draw() {
  if (!backgroundImage || !backgroundImage.naturalWidth) {
    canvas.width = 0;
    canvas.height = 0;
    return;
  }

  const sourceW = backgroundImage.naturalWidth;
  const sourceH = backgroundImage.naturalHeight;
  const maxSide = 2400;
  const resize = Math.min(1, maxSide / Math.max(sourceW, sourceH));
  const w = Math.max(1, Math.round(sourceW * resize));
  const h = Math.max(1, Math.round(sourceH * resize));

  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(backgroundImage, 0, 0, w, h);

  const blue = '#333366';
  const scale = w / 671;
  const score = `${$('home').value.trim() || '0'} - ${$('away').value.trim() || '0'}`;

  ctx.save();
  ctx.fillStyle = blue;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(126 * scale)}px "Bebas Neue", Impact, sans-serif`;
  ctx.translate(w * .5, h * .400);
  ctx.scale(.86, 1);
  ctx.fillText(score, 0, 0);
  ctx.restore();

  const cols = [
    { text: $('scorersHome').value, x: w * .47, width: w * .30, align: 'right' },
    { text: $('scorersAway').value, x: w * .53, width: w * .30, align: 'left' }
  ];

  ctx.fillStyle = blue;
  ctx.textBaseline = 'top';
  ctx.font = `400 ${Math.round(29 * scale)}px "Bebas Neue", Impact, sans-serif`;
  const y = h * .475;
  const lineH = Math.round(34 * scale);

  cols.forEach(col => {
    const lines = col.text.replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean);
    ctx.textAlign = col.align;
    lines.forEach((line, i) => ctx.fillText(line, col.x, y + i * lineH, col.width));
  });
}

function redraw() {
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(draw).catch(draw);
  } else {
    draw();
  }
}

function showLoadError(message) {
  $('photoStatus').textContent = message;
}

function loadSelectedFile(file) {
  if (!file) return;

  // Some iOS photo providers return an empty MIME type; trust the actual image decoder.
  if (file.type && !file.type.startsWith('image/')) {
    showLoadError('Il file selezionato non sembra essere un’immagine.');
    return;
  }

  showLoadError('Caricamento foto in corso…');

  const loadFromUrl = url => {
    const img = new Image();
    img.onload = () => {
      backgroundImage = img;
      redraw();
      showLoadError('Foto caricata correttamente. Ora puoi inserire risultato e marcatori.');
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
    };
    img.onerror = () => {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      // Fallback through FileReader for iOS/browser combinations that reject blob URLs.
      const reader = new FileReader();
      reader.onload = () => {
        const fallbackImg = new Image();
        fallbackImg.onload = () => {
          backgroundImage = fallbackImg;
          redraw();
          showLoadError('Foto caricata correttamente.');
        };
        fallbackImg.onerror = () => showLoadError('Non riesco a leggere questa foto. Prova a salvarla come JPEG e selezionarla di nuovo.');
        fallbackImg.src = reader.result;
      };
      reader.onerror = () => showLoadError('Lettura della foto non riuscita. Riprova a selezionarla.');
      reader.readAsDataURL(file);
    };
    img.src = url;
  };

  try {
    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);
    loadFromUrl(currentObjectUrl);
  } catch (error) {
    const reader = new FileReader();
    reader.onload = () => loadFromUrl(reader.result);
    reader.onerror = () => showLoadError('Lettura della foto non riuscita. Riprova a selezionarla.');
    reader.readAsDataURL(file);
  }
}

$('photo').addEventListener('change', e => {
  const file=e.target.files&&e.target.files[0];
  if(file) showLoadError('Foto selezionata. Premi “Carica foto” per inserirla nella grafica.');
});
$('loadPhoto').addEventListener('click', () => {
  const file=$('photo').files&&$('photo').files[0];
  if(!file){showLoadError('Prima scegli una foto dalla Galleria.');return;}
  loadSelectedFile(file);
});

['home', 'away', 'scorersHome', 'scorersAway'].forEach(id => {
  $(id).addEventListener('input', redraw);
});
$('update').addEventListener('click', redraw);

$('save').addEventListener('click', async () => {
  if (!backgroundImage || !backgroundImage.naturalWidth) {
    alert('Prima carica una foto della partita.');
    return;
  }

  redraw();

  // On iPhone, the Share sheet is more reliable than the desktop-style download attribute.
  if (canvas.toBlob && navigator.share && navigator.canShare) {
    canvas.toBlob(async blob => {
      if (!blob) {
        showLoadError('Creazione PNG non riuscita. Riprova.');
        return;
      }
      const pngFile = new File([blob], 'full-time.png', { type: 'image/png' });
      try {
        if (navigator.canShare({ files: [pngFile] })) {
          await navigator.share({ files: [pngFile], title: 'FULL TIME' });
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
      fallbackDownload();
    }, 'image/png');
    return;
  }

  fallbackDownload();
});

function fallbackDownload() {
  try {
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'full-time.png';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    a.remove();
    showLoadError('Se il PNG si apre in una nuova scheda su iPhone, usa Condividi → Salva immagine.');
  } catch (err) {
    showLoadError('Non riesco a creare il PNG. Riprova con una foto più piccola.');
  }
}

</script></body></html>
