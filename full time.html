<title>Generatore FULL TIME</title>

<style>
:root{--blue:#333366;--bg:#f3f4f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:#17172c}
main{max-width:760px;margin:0 auto;padding:18px 14px 34px}h1{font-size:24px;margin:4px 0 5px}.sub{color:#66677c;font-size:14px;margin:0 0 18px}
.panel,.preview{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 18px #20204412;margin-bottom:14px}
label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}input,textarea{width:100%;border:1px solid #d8d9e5;border-radius:11px;padding:12px;font:inherit;font-size:16px;background:white;color:#17172c}
textarea{min-height:96px;resize:vertical}.field{margin-top:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;width:100%;background:var(--blue);color:white;margin-top:10px}button.secondary{background:#e9e9f2;color:var(--blue)}
.file{padding:10px;background:#f8f8fc}canvas{display:block;width:100%;height:auto;border-radius:8px}.note{font-size:12px;color:#707186;line-height:1.45;margin:10px 4px 0}
@media(max-width:430px){main{padding:14px 10px 28px}.panel,.preview{padding:13px}.row{gap:8px}}
</style></head><body><main>

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
function draw(){
 if(!backgroundImage.complete||!backgroundImage.naturalWidth)return;
 const w=backgroundImage.naturalWidth,h=backgroundImage.naturalHeight;canvas.width=w;canvas.height=h;ctx.drawImage(backgroundImage,0,0,w,h);
 const blue='#333366',scale=w/671,score=`${$('home').value.trim()||'0'} - ${$('away').value.trim()||'0'}`;
 // Più alto e più marcato, con larghezza visiva contenuta nella stessa area di prima.
 ctx.save();ctx.fillStyle=blue;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font=`700 ${Math.round(126*scale)}px "Bebas Neue",Impact,sans-serif`;
 ctx.translate(w*.505,h*.400);ctx.scale(.86,1);ctx.fillText(score,0,0);ctx.restore();
 const cols=[
  {text:$('scorersHome').value,x:w*.43,width:w*.30,align:'right'},
  {text:$('scorersAway').value,x:w*.58,width:w*.30,align:'left'}
 ];
 ctx.fillStyle=blue;ctx.textBaseline='top';ctx.font=`400 ${Math.round(29*scale)}px "Bebas Neue",Impact,sans-serif`;
 const y=h*.475,lineH=Math.round(34*scale);
 cols.forEach(col=>{const lines=col.text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);ctx.textAlign=col.align;lines.forEach((line,i)=>ctx.fillText(line,col.x,y+i*lineH,col.width));});
}
function redraw(){document.fonts.ready.then(draw)}original.onload=redraw;
$('photo').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{backgroundImage=img;redraw()};img.src=reader.result};reader.readAsDataURL(file)});
['home','away','scorersHome','scorersAway'].forEach(id=>$(id).addEventListener('input',redraw));$('update').addEventListener('click',redraw);
$('save').addEventListener('click',()=>document.fonts.ready.then(()=>{draw();const a=document.createElement('a');a.download='full-time.png';a.href=canvas.toDataURL('image/png');a.click()}));
</script></body></html>
